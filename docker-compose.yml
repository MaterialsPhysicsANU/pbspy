services:
  pbspy-server:
    build: .
    ports:
      - "${PBSPY_PORT:-9876}:9876"
    volumes:
      - "${HOME}/.ssh:/home/pbspy/.ssh:ro"
    environment:
      # Direct-SSH-per-command mode (Server issues qsub/qstat over SSH for every call):
      - PBSPY_SSH_HOST=${SSH_HOST}
      - PBSPY_SSH_USER=${SSH_USER:-}
      - PBSPY_API_KEY=${PBSPY_API_KEY:-}
      - PBSPY_ALLOW_EXEC=${PBSPY_ALLOW_EXEC:-}
      # ProxyServer mode instead (relays to a Server running in a Gadi persistent session):
      # leave PBSPY_SSH_HOST unset and set these instead.
      - PBSPY_PROXY_TO=${PBSPY_PROXY_TO:-}
      - PBSPY_REMOTE_PORT=${PBSPY_REMOTE_PORT:-}
