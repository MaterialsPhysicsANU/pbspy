services:
  pbspy-server:
    build: .
    ports:
      - "${PBSPY_PORT:-9876}:9876"
    volumes:
      - "${HOME}/.ssh:/home/pbspy/.ssh:ro"
    environment:
      - PBSPY_SSH_HOST=${SSH_HOST}
      - PBSPY_SSH_USER=${SSH_USER:-}
      - PBSPY_API_KEY=${PBSPY_API_KEY:-}
      - PBSPY_ALLOW_EXEC=${PBSPY_ALLOW_EXEC:-}
